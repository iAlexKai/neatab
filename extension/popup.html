<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Neatab · 最近标签</title><link rel="stylesheet" href="popup.css"></head>
<body>
  <header><img src="icon128.png" width="36" height="36" alt=""><div><h1>Neatab</h1><p>回到刚才的上下文</p></div><span class="count">7</span></header>
  <section class="shortcut"><div><kbd>⌥ option</kbd><span>+</span><kbd>tab</kbd></div><p>按住 Option 选择，松开切换</p><p>⌘ ⇧ C · 复制当前网页链接</p></section>
  <section class="connection" aria-live="polite"><span id="dot"></span><div><strong id="status">正在连接…</strong><p id="detail">检查本机辅助程序</p></div></section>
  <div class="setup" id="setup" hidden><p id="setup-text"></p><button id="download">下载辅助程序</button><button id="permission">开启辅助功能权限</button><button class="secondary" id="reconnect">重新连接</button></div>
  <section class="recent"><div class="section-label"><h2>最近访问</h2><span id="tab-count">0 / 7</span></div><div id="tabs"></div><p id="empty" hidden>访问几个标签页后，它们会出现在这里。</p></section>
  <div class="manage"><button class="inactive" data-view="all"><span><strong>所有标签页</strong><small>关闭重复打开的页面，保留最近活跃的</small></span><span id="duplicate-count" class="badge">0</span></button><button class="inactive" data-view="inactive"><span><strong>不活跃标签页</strong><small>超过 12 小时未访问，可一键关闭</small></span><span id="inactive-count" class="badge">0</span></button></div>
  <section class="preferences"><label for="scope">切换范围<select id="scope"><option value="all">所有 Chrome 窗口</option><option value="window">当前窗口</option></select></label><label for="previews"><span>网页预览<small>停稳后缓存，最多 7 张</small></span><input type="checkbox" id="previews" role="switch"></label><label for="auto-discard"><span>自动释放内存<small id="discard-detail">长时间未访问的标签页释放内存，点开时重新加载；关闭时会提示「离开网站？」的跳过</small></span><input type="checkbox" id="auto-discard" role="switch"></label><label for="discard-after">释放时机<select id="discard-after"><option value="30">30 分钟未访问</option><option value="60">1 小时未访问</option><option value="120">2 小时未访问</option><option value="360">6 小时未访问</option></select></label></section>
  <footer><button id="metrics" class="text-button">查看本机性能</button><span>仅本机 · 无数据上传</span></footer>
  <p id="error" class="error" role="alert" hidden></p>
  <script src="popup.js" type="module"></script>
</body></html>
