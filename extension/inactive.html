<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>不活跃标签页 · Seven</title><link rel="stylesheet" href="inactive.css"></head>
<body>
  <main>
    <header><img src="icon128.png" width="40" height="40" alt=""><div><h1>不活跃标签页</h1><p id="summary">正在检查…</p></div>
      <button id="close-all" disabled>全部关闭</button></header>
    <p class="note">超过 12 小时没有切换到的标签页。正在显示、已固定或正在播放声音的标签页不会列出。</p>
    <ul id="list"></ul>
    <section id="empty" class="empty" hidden><strong>没有闲置的标签页</strong><p>最近 12 小时内访问过所有打开的标签页。</p></section>
    <p id="error" class="error" role="alert" hidden></p>
  </main>
  <div id="toast" class="toast" role="status" hidden><span id="toast-text"></span><button id="undo" class="text-button">撤销</button></div>
  <script src="inactive.js" type="module"></script>
</body></html>
